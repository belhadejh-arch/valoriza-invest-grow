[build]
  command = "pnpm run netlify:build"
  publish = ".output/public"

[functions]
  directory = "artifacts/api-server/netlify/functions"
  node_bundler = "esbuild"
  included_files = [".migration-backup/backend/migrations/*.sql"]

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  # Vite fingerprints these filenames, so a changed asset gets a new URL.
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  framework = "#custom"
  command = "pnpm --filter @workspace/valoriza-web run netlify-dev"
  targetPort = 18786
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
