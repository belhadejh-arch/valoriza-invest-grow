<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="favLeftGrad" x1="10%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="25%" stop-color="#009BF9" />
      <stop offset="60%" stop-color="#0C56DB" />
      <stop offset="100%" stop-color="#073090" />
    </linearGradient>

    <linearGradient id="favRightGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#062B82" />
      <stop offset="35%" stop-color="#0B4ECC" />
      <stop offset="75%" stop-color="#1466F6" />
      <stop offset="100%" stop-color="#00C0FF" />
    </linearGradient>

    <linearGradient id="favHighlightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E54E0" />
      <stop offset="60%" stop-color="#00B8FF" />
      <stop offset="100%" stop-color="#60D5FF" />
    </linearGradient>

    <linearGradient id="favFoldShadow" x1="40%" y1="10%" x2="60%" y2="90%">
      <stop offset="0%" stop-color="#031238" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#07205C" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0A338A" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="favArrowGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#0096F5" />
      <stop offset="50%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#55D6FF" />
    </linearGradient>
  </defs>

  <!-- Right Arm / Back Ribbon -->
  <path
    d="M 238 315
       C 265 260, 310 185, 342 128
       C 346 120, 354 122, 356 130
       L 358 152
       C 328 206, 282 284, 252 324
       C 244 332, 235 322, 238 315 Z"
    fill="url(#favRightGrad)"
  />

  <!-- Right Arm Facet / Outer Highlight Edge -->
  <path
    d="M 334 135
       C 344 118, 352 118, 356 128
       L 358 156
       C 342 186, 312 240, 280 290
       L 272 278
       C 300 234, 324 180, 334 135 Z"
    fill="url(#favHighlightGrad)"
  />

  <!-- Left Ribbon / Front Main Wing -->
  <path
    d="M 122 108
       C 140 102, 172 124, 194 170
       C 216 216, 238 274, 248 304
       C 254 322, 242 334, 230 328
       C 208 312, 180 264, 154 204
       C 134 158, 112 120, 122 108 Z"
    fill="url(#favLeftGrad)"
  />

  <!-- Inner Fold Shadow for 3D Depth -->
  <path
    d="M 188 165
       C 208 210, 230 265, 244 298
       C 236 290, 222 260, 206 220
       C 194 190, 184 170, 188 165 Z"
      fill="url(#favFoldShadow)"
  />

  <!-- Dynamic Upward Growth Arrow -->
  <path
    d="M 318 92
       L 384 72
       L 362 128
       L 350 110
       L 334 116
       L 318 92 Z"
    fill="url(#favArrowGrad)"
  />
</svg>
