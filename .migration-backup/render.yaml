services:
  - type: web
    name: valoriza-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: POSTGRES_URL
        fromDatabase:
          name: valoriza-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@valoriza.com
      - key: ADMIN_PASSWORD
        value: ValorizaAdmin2025!
      - key: USER_EMAIL
        value: user@valoriza.com
      - key: USER_PASSWORD
        value: ValorizaUser2025!

databases:
  - name: valoriza-postgres
    plan: free
