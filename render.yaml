services:
  # Valoriza Backend Service on Render
  - type: web
    name: valoriza-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@valoriza.com
      - key: ADMIN_PASSWORD
        value: AdminValoriza2026!
